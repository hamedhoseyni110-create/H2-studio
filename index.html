<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H2 Studio</title>
<meta name="description" content="H2 Studio — ویدیوهای سینمایی با هوش مصنوعی، سایت‌های ایمِرسیو و اپلیکیشن">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
</head>
<body>

<a class="skip" href="#services" id="skipLink"></a>

<header class="nav" id="nav">
  <a class="wordmark" href="#top" dir="ltr"><img src="assets/logo.svg" alt="H2 Studio" class="wordmark-logo">H<b>2</b> Studio</a>
  <nav class="nav-links" id="navLinks" aria-label="main"></nav>
  <div class="nav-actions">
    <button class="lang-toggle" id="langToggle" type="button"></button>
    <button class="btn btn-primary btn-compact" id="navCta" type="button" data-wizard-open></button>
    <button class="hamburger" id="hamburger" type="button" aria-expanded="false" aria-controls="navLinks">&#9776;</button>
  </div>
</header>

<main>
  <section class="hero" id="top" aria-label="hero">
    <div class="hero-media">
      <img class="hero-poster" src="assets/hero-poster.jpg" alt="" fetchpriority="high">
      <video class="hero-video" id="heroVideo" muted autoplay loop playsinline
             preload="metadata" poster="assets/hero-poster.jpg" aria-hidden="true" tabindex="-1">
        <source src="assets/hero.mp4" type="video/mp4">
      </video>
      <div class="hero-scrim"></div>
    </div>
    <div class="hero-text">
      <h1 id="heroHeadline"></h1>
      <p class="hero-sub" id="heroSub"></p>
      <button class="btn btn-primary btn-lg" id="heroCta" type="button" data-wizard-open></button>
    </div>
  </section>

  <section class="section" id="services">
    <div class="wrap">
      <h2 class="section-title" id="servicesTitle"></h2>
      <div class="services-grid" id="servicesGrid"></div>
    </div>
  </section>

  <section class="section" id="work">
    <div class="wrap">
      <h2 class="section-title" id="workTitle"></h2>
      <p class="section-sub" id="workSub"></p>
      <div class="work-grid" id="workGrid"></div>
      <div class="section-cta">
        <button class="btn btn-primary" id="workCta" type="button" data-wizard-open></button>
      </div>
    </div>
  </section>

  <section class="section" id="process">
    <div class="wrap">
      <h2 class="section-title" id="processTitle"></h2>
      <ol class="process-steps" id="processSteps"></ol>
    </div>
  </section>

  <section class="section" id="about">
    <div class="wrap">
      <h2 class="section-title" id="aboutTitle"></h2>
      <p class="about-body" id="aboutBody"></p>
    </div>
  </section>

  <section class="section" id="contact">
    <div class="wrap contact-box">
      <h2 class="section-title" id="contactTitle"></h2>
      <p id="contactBody"></p>
      <button class="btn btn-primary btn-lg" id="contactCta" type="button" data-wizard-open></button>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap">
    <p class="footer-tagline" id="footerTagline"></p>
    <a class="footer-ig" id="footerIg" href="https://www.instagram.com/hamed_hoseyni110/" target="_blank" rel="noopener" dir="ltr">Instagram</a>
    <p class="footer-copy">© <span dir="ltr">H2 Studio</span></p>
  </div>
</footer>

<div class="overlay" id="wizard" role="dialog" aria-modal="true" aria-labelledby="wizardTitle" hidden>
  <div class="wizard-shell">
    <div class="wizard-head">
      <div class="wizard-stepof" id="wizardStepOf"></div>
      <div class="progress" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
      <button class="wizard-close" id="wizardClose" type="button"></button>
    </div>
    <div class="wizard-body" id="wizardBody"></div>
    <div class="wizard-foot" id="wizardFoot">
      <button class="btn btn-ghost" id="wizardBack" type="button"></button>
      <button class="btn btn-primary" id="wizardNext" type="button"></button>
    </div>
  </div>
</div>

<div class="overlay" id="videoModal" role="dialog" aria-modal="true" aria-labelledby="videoModalTitle" hidden>
  <div class="video-shell">
    <div class="video-head">
      <h2 id="videoModalTitle"></h2>
      <button class="wizard-close" id="videoClose" type="button"></button>
    </div>
    <video id="modalVideo" controls playsinline preload="none"></video>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
